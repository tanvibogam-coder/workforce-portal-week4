<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Management · Workforce Portal</title><link rel="stylesheet" href="css/style.css"></head><body><div id="root"></div>
<script src="js/api.js"></script><script src="js/ui.js"></script>
<script>(async () => { const me = shell("Project Management", ALL); if (!me) return; const V = $('#view');

const isMgr = MGR.includes(me.role), isHR = HRR.includes(me.role);
V.innerHTML = `<div class="page-h"><div><h1>Projects</h1><p>Departmental projects with live progress</p></div><span class="sp"></span>${isMgr ? '<button class="pri" id="new">+ New project</button>' : ''}</div><div id="list"></div>`;
const load = guard(async () => { const rows = await api('/projects');
  $('#list').innerHTML = rows.length ? `<div class="grid2">${rows.map((p) => { const pc = p.tasks ? Math.round((100 * p.done) / p.tasks) : 0; return `<div class="panel"><h3>${esc(p.name)} ${badge(p.status)}</h3><p>${esc(p.department)} · ${day(p.start_date)} → ${day(p.end_date)}</p>${bar(pc)}<p><small>${pc}% complete · ${p.done}/${p.tasks} tasks · ${p.overdue} overdue</small></p><p>${esc(p.description || '')}</p><p><small>Team: ${esc(p.members || '—')}</small></p><a class="btn sm" href="tasks.html?project_id=${p.id}">View tasks</a> ${isMgr ? `<button class="sm" data-m="${p.id}">+ Allocate employee</button>` : ''}</div>`; }).join('')}</div>` : '<div class="panel empty">No projects yet.</div>'; });
V.onclick = guard(async (e) => { const b = e.target.closest('button'); if (!b || !b.dataset.m) return; const people = await lookup();
  modal('Allocate employee', [{ name: 'employee_id', label: 'Employee', type: 'select', options: people, required: true }], {}, async (v) => { await api(`/projects/${b.dataset.m}/members`, { method: 'POST', body: { employee_id: +v.employee_id } }); toast('Employee allocated'); load(); }); });
if (isMgr) $('#new').onclick = guard(async () => { const d = isHR ? await deptOpts() : [];
  modal('New project', [{ name: 'name', label: 'Project name', required: true }, ...(isHR ? [{ name: 'department_id', label: 'Department', type: 'select', options: d, required: true }] : []), { name: 'description', label: 'Description', type: 'textarea' }, { name: 'start_date', label: 'Start date', type: 'date' }, { name: 'end_date', label: 'End date', type: 'date' }], {},
    async (v) => { await api('/projects', { method: 'POST', body: v }); toast('Project created'); load(); }); });
load();

})().catch((e) => { const v = document.querySelector('#view'); if (v) v.innerHTML = '<div class="panel"><h2>Something went wrong</h2><p>' + esc(e.message) + '</p></div>'; console.error(e); });</script></body></html>
